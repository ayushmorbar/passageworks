name: Passageworks CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Lint, Unit Tests & Schema Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.13.7"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Code formatting & lint check
        run: |
          ruff check .
          ruff format --check .

      - name: Run unit & mock integration tests
        run: |
          pytest tests/ -v -m "not real_provider"

      - name: Validate CSV output schema
        run: |
          pytest tests/test_csv_schema.py -v
