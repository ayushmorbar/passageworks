[project]
name = "passageworks"
version = "0.1.0"
description = "A paper-grounded question-answering pipeline with measured behavior under load"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
    "pypdf>=6.19.0",
    "rank-bm25>=0.2.2",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/passageworks", "src/passageworks_standin"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real_provider: tests requiring live Groq API credentials",
]
